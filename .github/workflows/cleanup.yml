name: Cleanup drafts

# Daily: delete guides never published within 24 h (and their files). Also keeps the free
# Supabase project from pausing through judging (2026-11-05 → 11-09).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/showhow
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/showhow/package-lock.json
      - run: npm ci
      - name: Delete stale drafts
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "Supabase secrets not configured; skipping."; exit 0; fi
          node scripts/cleanup-drafts.ts
