<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showhow · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F0E6; --surface:#FFFCF6; --surface-2:#EEE6D7; --line:#DCD2C0;
  --ink:#1D1B18; --ink-2:#5A5248; --ink-3:#857B6E;
  --primary:#1F5A4C; --primary-hover:#174538; --primary-soft:#DCE9E3; --on-primary:#FFFFFF;
  --signal:#EE5A17; --signal-soft:#FDE4D5;
  --ok:#2C7A4B; --ok-soft:#DDEFE3; --warn:#A8500B; --warn-soft:#FBE9D2;
  --wood:#D9B98A; --wood-edge:#A7834F; --wood-dark:#C2A06E; --board:#CDB99D; --metal:#C9CDD2;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 0 rgba(29,27,24,.04),0 6px 18px -10px rgba(29,27,24,.25);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top */
.proto{background:var(--ink);color:#EDE6D8;font-size:13px;text-align:center;padding:6px 16px}
.proto b{color:#fff}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:21px}
.logo-mark{width:32px;height:32px}
.nav{margin-left:auto;display:flex;gap:6px;align-items:center}
.nav a{text-decoration:none;padding:9px 12px;border-radius:999px;color:var(--ink-2);font-weight:700;font-size:15px}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.nav a.btn{color:var(--on-primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid transparent;font-weight:700;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:var(--surface);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink-3)}
.btn-signal{background:var(--signal);color:#fff}
.btn-signal:hover{background:#D24C10}
.btn[disabled]{opacity:.5;cursor:not-allowed}
main{max-width:1240px;margin:0 auto;padding:28px 20px 80px}

/* gallery */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:20px 0 36px}
.hero h1{font-size:clamp(38px,5.4vw,64px);font-weight:800}
.hero h1 em{font-style:normal;color:var(--primary);background:linear-gradient(transparent 62%,var(--signal-soft) 62%)}
.hero p{font-size:19px;color:var(--ink-2);max-width:34em;margin:16px 0 0}
.how{display:grid;gap:12px}
.how li{list-style:none;display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.how ol{margin:0;padding:0;display:grid;gap:10px}
.how .n{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-family:var(--display);font-weight:800;font-size:18px}
.how li:nth-child(2) .n{background:var(--signal-soft);color:var(--signal)}
.how li:nth-child(3) .n{background:var(--ok-soft);color:var(--ok)}
.how b{display:block}
.how span{color:var(--ink-2);font-size:15px}
.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 22px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:46px;color:var(--ink-3)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--ink)}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.thumb{position:relative;aspect-ratio:16/10;background:var(--surface-2)}
.thumb>svg,.thumb>video{display:block;width:100%;height:100%;object-fit:cover}
.thumb .badge{position:absolute;left:10px;bottom:10px}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(29,27,24,.82);color:#fff;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.badge.new{background:var(--signal)}
.card-b{padding:14px 16px 16px;display:grid;gap:8px}
.card h3{font-size:19px;font-weight:700}
.meta{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:14px;flex-wrap:wrap}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.dot{width:3px;height:3px;border-radius:50%;background:var(--ink-3)}
.checkable{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:700;font-size:13.5px}
.empty{padding:40px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}

/* guide */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-weight:700;margin-bottom:14px;min-height:40px}
.g-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.g-head h1{font-size:clamp(28px,3.6vw,42px);font-weight:800}
.g-layout{display:grid;grid-template-columns:290px 1fr;gap:24px;align-items:start}
.g-layout>*{min-width:0}
.steps{position:sticky;top:84px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:grid;gap:4px}
.steps .prog{padding:8px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--primary);transition:width .3s}
.step-btn{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-align:left;background:transparent;border:0;border-radius:10px;padding:9px 10px;min-height:48px}
.step-btn:hover{background:var(--paper)}
.step-btn .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-weight:700;font-size:14px;color:var(--ink-2)}
.step-btn[aria-current="step"]{background:var(--primary-soft)}
.step-btn[aria-current="step"] .num{border-color:var(--primary);background:var(--primary);color:#fff}
.step-btn.done .num{border-color:var(--ok);color:var(--ok)}
.step-btn small{display:block;color:var(--ink-3);font-size:12.5px}
.step-btn span{font-weight:700;font-size:15px;line-height:1.25}
.player{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stage{position:relative;aspect-ratio:16/10;background:#E9DFCC}
.stage svg.scene,.stage video{display:block;width:100%;height:100%;object-fit:cover}
.stage-ui{position:absolute;inset:auto 12px 12px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:999px;background:rgba(29,27,24,.84);color:#fff;font-weight:700;font-size:13.5px;border:0}
.pill.on{background:var(--signal)}
.pill.round{width:44px;height:44px;padding:0;justify-content:center}
.stage-label{position:absolute;top:12px;left:12px}
.timeline{display:flex;gap:4px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.timeline .lbl{font-size:12.5px;color:var(--ink-3);font-weight:700;margin-right:6px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.seg{height:28px;flex:var(--w,1);border-radius:6px;border:0;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--ink-3);min-width:24px}
.seg:hover{background:var(--line)}
.seg[aria-current="true"]{background:var(--primary);color:#fff}
.instr{display:grid;gap:14px;padding:20px 22px 22px}
.instr .k{font-size:13px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.06em}
.instr h2{font-size:clamp(24px,2.6vw,32px);font-weight:800}
.instr p{margin:0;font-size:18px;max-width:42em}
.part{display:inline-flex;align-items:center;gap:8px;background:var(--signal-soft);color:#8A3A0C;font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;width:max-content;max-width:100%}
.part i{width:10px;height:10px;border-radius:3px;border:2px solid var(--signal)}
.tip{display:grid;grid-template-columns:36px 1fr;gap:12px;background:var(--paper);border-radius:var(--radius-sm);padding:12px 14px;color:var(--ink-2)}
.tip .mic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.tip q{font-style:italic;color:var(--ink)}
.tip small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:4px}
.actions .sp{flex:1}
.stuck-cta{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-top:16px;background:var(--ink);color:var(--paper);border-radius:var(--radius);padding:16px 18px}
.stuck-cta b{font-family:var(--display);font-size:20px;display:block;color:#fff}
.stuck-cta span{color:#CFC6B6;font-size:15px}
.stuck-cta .btns{display:flex;gap:10px;flex-wrap:wrap}
.stuck-cta .btn-ghost{background:transparent;color:#fff;border-color:#5A5248}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(29,27,24,.55)}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:22px}
.d-body{padding:20px;display:grid;gap:16px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:grid;gap:8px;justify-items:start;text-align:left;padding:18px;border-radius:var(--radius);border:2px dashed var(--line);background:var(--paper);min-height:130px;cursor:pointer;position:relative}
.opt:hover,.opt:focus-within{border-color:var(--primary)}
.opt b{font-size:17px}
.opt span{color:var(--ink-2);font-size:14.5px}
.opt input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.opt .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
label.fl{font-weight:700;font-size:15px;display:grid;gap:6px}
textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface);resize:vertical}
textarea:focus,input.txt:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.review{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rv{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--paper)}
.rv .im{aspect-ratio:16/10;background:var(--surface-2)}
.rv .im img,.rv .im svg{width:100%;height:100%;object-fit:cover;display:block}
.rv p{margin:0;padding:8px 10px;font-size:13.5px;color:var(--ink-2)}
.rv p b{color:var(--ink)}
.recip{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.recip li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14.5px}
.recip .tag{font-size:12px;font-weight:700;color:var(--ink-3);text-align:right}
.note{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2);background:var(--paper);padding:10px 12px;border-radius:var(--radius-sm)}
.d-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:16px 20px;border-top:1px solid var(--line)}
.stages{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.stages li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;color:var(--ink-3)}
.stages li .st{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.stages li.run{color:var(--ink)}
.stages li.run .st{border-color:var(--primary);border-top-color:transparent;animation:spin 0.9s linear infinite}
.stages li.done{color:var(--ink)}
.stages li.done .st{border-color:var(--ok);background:var(--ok);color:#fff}
.stages li.done .st svg{width:14px;height:14px;stroke-width:3}
.stages b{display:block}
.stages small{font-size:13.5px;color:var(--ink-3)}
@keyframes spin{to{transform:rotate(360deg)}}
.verdict{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
.v-photo{position:relative;border-radius:var(--radius-sm);overflow:hidden;aspect-ratio:16/10;background:var(--surface-2)}
.v-photo img,.v-photo>svg{width:100%;height:100%;object-fit:cover;display:block}
.v-photo .ov{position:absolute;inset:0;width:100%;height:100%}
.v-card{border-radius:var(--radius-sm);padding:14px;display:grid;gap:10px}
.v-card.warn{background:var(--warn-soft)}
.v-card.ok{background:var(--ok-soft)}
.v-card h3{font-size:20px;display:flex;gap:8px;align-items:center}
.v-card.warn h3{color:var(--warn)}
.v-card.ok h3{color:var(--ok)}
.v-card p{margin:0}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:14.5px}
.checks li{display:flex;gap:8px;align-items:center}
.checks .y{color:var(--ok)} .checks .n{color:var(--warn)}
.src{font-size:12.5px;color:var(--ink-3)}

/* create */
.c-wrap{max-width:980px;margin:0 auto}
.c-steps{display:flex;gap:8px;margin:6px 0 24px;flex-wrap:wrap}
.c-steps li{list-style:none;display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;color:var(--ink-3);padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.c-steps li[aria-current="step"]{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.c-steps li.done{color:var(--ok)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.drop{display:grid;place-items:center;text-align:center;gap:10px;padding:44px 20px;border:2px dashed var(--line);border-radius:var(--radius);background:var(--paper);position:relative}
.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.drop .ic svg{width:28px;height:28px}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:14px;margin:16px 0}
.or::before,.or::after{content:"";height:1px;flex:1;background:var(--line)}
.sample{display:grid;grid-template-columns:160px 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--paper)}
.sample .th{aspect-ratio:16/10;border-radius:8px;overflow:hidden}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
input.txt,select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface)}
.proc{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.trans{background:var(--paper);border-radius:var(--radius-sm);padding:14px;display:grid;gap:8px;max-height:300px;overflow:auto;font-size:15px}
.trans .ln{display:grid;grid-template-columns:52px 1fr;gap:8px;animation:fade .35s ease both}
.trans .ts{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:13px;padding-top:2px}
.trans .ln.cut{border-top:2px solid var(--primary);padding-top:8px;margin-top:2px}
.trans .ln.cut .ts::after{content:"STEP";display:block;color:var(--primary);font-weight:700;font-size:11px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.gen{display:grid;gap:12px}
.gen-row{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start;border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--surface)}
.gen-row .th{aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--surface-2);position:relative}
.gen-row .th video,.gen-row .th svg{width:100%;height:100%;object-fit:cover;display:block}
.gen-row input.txt{font-weight:700}
.gen-row textarea{min-height:60px;margin-top:8px}
.gen-row .ts{font-size:13px;color:var(--ink-3);font-weight:700;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.share{display:grid;gap:14px;text-align:center;justify-items:center;padding:28px 10px}
.share .ok-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.share .ok-ic svg{width:32px;height:32px;stroke-width:2.5}
.linkbox{display:flex;gap:8px;align-items:center;width:min(520px,100%);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px}
.linkbox code{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;transition:.2s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* scene animation */
.sam{fill:color-mix(in srgb,var(--signal) 16%,transparent);stroke:var(--signal);stroke-width:4;stroke-dasharray:12 8;animation:ants 1.2s linear infinite;vector-effect:non-scaling-stroke}
.sam-tag rect{fill:var(--signal)} .sam-tag text{fill:#fff;font:700 15px var(--body)}
.hide-sam .sam,.hide-sam .sam-tag{display:none}
@keyframes ants{to{stroke-dashoffset:-40}}
.a-in{animation:pop 6s ease-in-out infinite both}
.a-drop{animation:dropIn 4s cubic-bezier(.3,.7,.3,1) infinite both}
.a-slideL{animation:slideL 5s cubic-bezier(.3,.7,.3,1) infinite both}
.a-slideD{animation:slideD 5s cubic-bezier(.3,.7,.3,1) infinite both}
.a-turn{animation:turn 4s ease-in-out infinite both;transform-box:fill-box;transform-origin:center}
.a-blink{animation:blink 5s ease infinite both}
@keyframes pop{0%,8%{opacity:0;transform:translateY(-14px)}20%,92%{opacity:1;transform:none}100%{opacity:0}}
@keyframes dropIn{0%,10%{transform:translateY(-70px);opacity:0}40%,90%{transform:none;opacity:1}100%{opacity:0}}
@keyframes slideL{0%,10%{transform:translateX(150px);opacity:0}45%,90%{transform:none;opacity:1}100%{opacity:0}}
@keyframes slideD{0%,10%{transform:translateY(-120px);opacity:0}45%,90%{transform:none;opacity:1}100%{opacity:0}}
@keyframes turn{0%,20%{transform:rotate(0)}55%,85%{transform:rotate(90deg)}100%{transform:rotate(0)}}

}

  main{padding:18px 16px 70px}

}

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = (n, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 120) : ms));

/* ---------- scenes (SVG illustrations standing in for video frames) ---------- */

const SCENES = {

function genericScene(kind, hot, label) {
  const [x, y] = hot || [320, 200];
  return `${bench}${GLYPH[kind] || ""}${hot ? `<circle class="sam" cx="${x}" cy="${y}" r="42"/>${tag(Math.min(x - 40, 420), Math.min(y + 52, 356), label || "Key part")}` : ""}
    <text x="620" y="30" text-anchor="end" font-size="13" font-weight="700" fill="#857B6E">ILLUSTRATION</text>`;
}
const svg = inner => `<svg class="scene" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">${inner}</svg>`;

/* sample "learner photos" */

/* ---------- dummy data ---------- */
const GUIDES = [
  { id:"bookcase", title:"Assemble a 3‑shelf bookcase", cat:"DIY", creator:"Ahmed R.", color:"#1F5A4C", mins:18, checks:"1.4k", thumb:()=>SCENES.b5(true),

      {t:"Attach shelves to the left side", s:"00:58", e:"01:40", scene:"b3", part:"Cam holes · face up", text:"Slide each shelf onto the dowels. The round cam holes on each shelf must face up, towards the ceiling.", tip:"Look for the two big round holes. If you can't see them from above, your shelf is upside down.",

const toSec = t => { const [m, s] = t.split(":").map(Number); return m * 60 + s; };

async function runCheck() {

    ["Muse Voice Transcribe", "Turning your narration into text"],
    ["Muse Spark", "Finding where each step starts and ends"],
    ["SAM 3.1", "Outlining the key part in every step"],
    ["Writing step cards", "Instructions use your own words"],
  ];
  $("#cp").innerHTML = `<div class="proc">
    <div><h2 style="font-size:20px;margin-bottom:14px">Building your guide</h2><ul class="stages" aria-live="polite">${stages.map(([a, b]) => `<li><span class="st"></span><div><b>${a}</b><small>${b}</small></div></li>`).join("")}</ul>
    <p class="src">Prototype: stages are simulated, nothing is uploaded.</p></div>
    <div><h2 style="font-size:20px;margin-bottom:14px">Transcript ${D.video ? "(dummy)" : ""}</h2><div class="trans" id="tr"><span style="color:var(--ink-3)">Waiting for audio…</span></div></div></div>`;
  let dur = 70;
  if (D.video) dur = await new Promise(r => { const v = document.createElement("video"); v.preload = "metadata"; v.onloadedmetadata = () => r(isFinite(v.duration) ? v.duration : 60); v.onerror = () => r(60); v.src = D.video; });
  D.dur = dur;
  const lis = $("#cp").querySelectorAll(".stages li"), tr = $("#tr");
  for (let k = 0; k < lis.length; k++) {
    if (!$("#tr")) return; // navigated away
    lis[k].className = "run";
    if (k === 1) {
      tr.innerHTML = "";
      const lines = D.video ? SAMPLE_TRANSCRIPT.map(([, txt, cut], n) => [fmt(dur * n / SAMPLE_TRANSCRIPT.length), txt, cut]) : SAMPLE_TRANSCRIPT;
      for (const [ts, txt] of lines) { tr.insertAdjacentHTML("beforeend", `<div class="ln"><span class="ts">${ts}</span><span>${esc(txt)}</span></div>`); tr.scrollTop = tr.scrollHeight; await wait(260); }
    } else if (k === 2) {
      tr.querySelectorAll(".ln").forEach((el, n) => { if (SAMPLE_TRANSCRIPT[n][2]) el.classList.add("cut"); });
      await wait(900);
    } else await wait(900);
    lis[k].className = "done"; lis[k].querySelector(".st").innerHTML = ic("check");
  }
  D.steps = D.video
    ? SAMPLE_STEPS.map((s, n) => ({ ...s, t:`Step ${n + 1} (edit me)`, text:"Dummy text: in the real app this is written from your narration for this part of the video.", s:fmt(dur * n / 4), e:fmt(dur * (n + 1) / 4), part:"Key part" }))
    : SAMPLE_STEPS.map(s => ({ ...s }));
  await wait(400);
  if (D.phase === "process") { D.phase = "review"; viewCreate(); }
}
function cReview() {
  $("#cp").innerHTML = `<h2 style="font-size:20px">Review your ${D.steps.length} steps</h2>
    <p style="color:var(--ink-2);margin:6px 0 16px">Edit anything that's not quite right. Learners see exactly this.</p>
    <div class="gen">${D.steps.map((s, n) => `<div class="gen-row">
      <div class="th">${D.video ? `<video src="${D.video}#t=${toSec(s.s)}" muted preload="metadata"></video>` : svg(genericScene("vacuum", s.hot, s.part))}</div>
      <div><label class="sr" for="st${n}">Step ${n + 1} title</label><input class="txt" id="st${n}" data-n="${n}" data-f="t" value="${esc(s.t)}">
        <label class="sr" for="sx${n}">Step ${n + 1} instruction</label><textarea id="sx${n}" data-n="${n}" data-f="text">${esc(s.text)}</textarea>
        <div class="ts"><span>${ic("film")} ${s.s}–${s.e}</span><span style="color:var(--signal)">${ic("frame")} ${esc(s.part)}</span></div></div></div>`).join("")}</div>
    <div class="actions" style="margin-top:18px"><button class="btn btn-ghost" id="restart">Start over</button><span class="sp"></span><button class="btn btn-primary" id="pub">${ic("check")} Publish guide</button></div>`;
  $("#cp").querySelectorAll("[data-f]").forEach(el => el.addEventListener("input", () => { D.steps[el.dataset.n][el.dataset.f] = el.value; }));
  $("#restart").addEventListener("click", () => { Object.assign(D, { phase:"upload", sampleUsed:false }); viewCreate(); });
  $("#pub").addEventListener("click", () => {
    const id = "my-" + Date.now().toString(36);
    GUIDES.unshift({ id, title:D.title, cat:D.cat, creator:"You", color:"#EE5A17", mins:Math.max(1, Math.round(D.dur / 60 * 4)), checks:"0", kind:"vacuum", video:D.video, isNew:true, steps:D.steps.map(s => ({ ...s })) });
    D.created = id; D.phase = "share"; viewCreate();
  });
}
function cShare() {
  const url = `https://showhow.app/g/${D.created}`;
  $("#cp").innerHTML = `<div class="share"><span class="ok-ic">${ic("check")}</span><h2 style="font-size:26px">Your guide is live in the gallery</h2>
    <p style="margin:0;color:var(--ink-2)">Anyone with the link can follow it, no account needed, and check their work against yours.</p>
    <div class="linkbox"><code>${url}</code><button class="btn btn-primary" id="copy">${ic("link")} Copy</button></div>
    <div class="actions"><a class="btn btn-ghost" href="#/guide/${D.created}/1">${ic("eye")} Open as a learner</a><button class="btn btn-ghost" id="another">Make another</button></div>
    <p class="src">Prototype link: it doesn't open anywhere yet.</p></div>`;
  $("#copy").addEventListener("click", () => { (navigator.clipboard?.writeText(url) || Promise.reject()).then(() => toast("Link copied"), () => toast(url)); });
  $("#another").addEventListener("click", () => { Object.assign(D, { phase:"upload", video:null, sampleUsed:false, title:"" }); viewCreate(); });
}

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200); }
route();
</script>
</body>
</html>
